<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Victor Rossi — visor de câmera detectando: estudante de Engenharia de Software, Python, Visão Computacional e Design">
  <defs>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#14110f"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FFC857"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1200" height="340" fill="url(#vignette)"/>

  <!-- grade de terços -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
    <line x1="0" y1="113" x2="1200" y2="113"/>
    <line x1="0" y1="227" x2="1200" y2="227"/>
  </g>

  <!-- cantos do visor -->
  <g stroke="#f5f0e8" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M30 70 V30 H70"/>
    <path d="M1130 30 H1170 V70"/>
    <path d="M30 270 V310 H70"/>
    <path d="M1130 310 H1170 V270"/>
  </g>

  <!-- HUD superior -->
  <circle cx="98" cy="50" r="8" fill="#FF3B30">
    <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="114" y="57" font-family="'Courier New', Consolas, monospace" font-size="18" font-weight="700" fill="#f5f0e8">REC</text>
  <text x="175" y="57" font-family="'Courier New', Consolas, monospace" font-size="18" fill="#9a928a">00:19:00:00</text>
  <text x="1100" y="57" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="18" fill="#9a928a">SP · BR · 4K · 60fps</text>

  <!-- caixa de detecção -->
  <g>
    <rect x="80" y="105" width="640" height="150" fill="none" stroke="url(#warm)" stroke-width="2.5">
      <animate attributeName="stroke-opacity" values="1;0.55;1" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="81" width="290" height="26" fill="url(#warm)"/>
    <text x="90" y="100" font-family="'Courier New', Consolas, monospace" font-size="16" font-weight="700" fill="#14110f">person: victor_rossi · 0.99</text>

    <text x="108" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" fill="#f5f0e8">Victor Rossi</text>
    <text x="110" y="232" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" letter-spacing="3" fill="#c9bfb3">ENG. DE SOFTWARE · FIAP</text>
  </g>

  <!-- etiquetas de "detecção" -->
  <g font-family="'Courier New', Consolas, monospace" font-size="15">
    <rect x="770" y="130" width="190" height="30" fill="none" stroke="#FFC857" stroke-width="1.5"/>
    <text x="782" y="150" fill="#FFC857">python · 0.97</text>
    <rect x="800" y="178" width="290" height="30" fill="none" stroke="#FF8C42" stroke-width="1.5"/>
    <text x="812" y="198" fill="#FF8C42">computer_vision · 0.95</text>
    <rect x="780" y="226" width="200" height="30" fill="none" stroke="#FF6B35" stroke-width="1.5"/>
    <text x="792" y="246" fill="#FF6B35">design · 0.98</text>
  </g>

  <!-- mira de foco -->
  <g stroke="#f5f0e8" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="1090" y1="140" x2="1090" y2="160"/>
    <line x1="1080" y1="150" x2="1100" y2="150"/>
  </g>

  <!-- HUD inferior -->
  <text x="98" y="297" font-family="'Courier New', Consolas, monospace" font-size="16" fill="#9a928a">ISO 400 · f/1.4 · 1/120 · AWB</text>
  <text x="1100" y="297" text-anchor="end" font-family="'Courier New', Consolas, monospace" font-size="16" fill="#9a928a">● FOCUS: LOCKED</text>
</svg>
